services:

  runtime:
    image: runtime:1.6
    container_name: runtime
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      - "3306:3306"
      - "6379:6379"
      - "8080:8080"

    environment:
      TZ: Asia/Shanghai

      # ======================================================
      # MySQL
      # ======================================================

      MYSQL_ROOT_PASSWORD: "mysqlpasswd"
      REDIS_PASSWORD: "redispasswd"
      # MYSQL_DATABASE: "app"
      # MYSQL_USER: "app"
      # MYSQL_PASSWORD: "app123456"

      # ======================================================
      # Redis
      # ======================================================


    volumes:

      # 前端静态资源
      - /data/ai-model-manage/dist:/data/ai-model-manage/dist

      # Java jar 包目录
      - /data/ai-model-manage/java:/opt/app

      # ======================================================
      # 如果需要持久化 MySQL
      # ======================================================

      # - ./mysql:/var/lib/mysql

      # ======================================================
      # 如果需要持久化 Redis
      # ======================================================

      # - ./redis:/var/lib/redis

      # ======================================================
      # Spring Boot 配置
      # ======================================================
      # - ./config:/opt/app/config

      # ======================================================
      # Nginx 配置
      # ======================================================

      - /etc/nginx/nginx.conf:/etc/nginx/nginx.conf

      # ======================================================
      # 自定义 Supervisor
      # ======================================================

      # - ./supervisord.conf:/etc/supervisor/supervisord.conf:ro
