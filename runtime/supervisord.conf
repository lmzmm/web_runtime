[supervisord]

nodaemon=true
user=root

logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info


[unix_http_server]

file=/var/run/supervisor.sock


[supervisorctl]

serverurl=unix:///var/run/supervisor.sock


; ============================================================
; MySQL
; ============================================================

[program:mysql]

command=/usr/local/mysql/bin/mysqld --defaults-file=/etc/mysql/my.cnf --user=mysql

user=mysql

autostart=true
autorestart=true

startsecs=5
startretries=3

stopasgroup=true
killasgroup=true

stdout_logfile=/var/log/mysql-supervisor.log
stderr_logfile=/var/log/mysql-supervisor-error.log


; ============================================================
; Redis
; ============================================================

[program:redis]

command=/usr/bin/redis-server /etc/redis/redis.conf

user=redis

autostart=true
autorestart=true

startsecs=1
startretries=3

stopasgroup=true
killasgroup=true

stdout_logfile=/var/log/redis-supervisor.log
stderr_logfile=/var/log/redis-supervisor-error.log


; ============================================================
; Nginx
; ============================================================

[program:nginx]

command=/usr/sbin/nginx -g "daemon off;"

autostart=true
autorestart=true

startsecs=1
startretries=3

stopasgroup=true
killasgroup=true

stdout_logfile=/var/log/nginx-supervisor.log
stderr_logfile=/var/log/nginx-supervisor-error.log


; ============================================================
; 自动加载 Java
; ============================================================

[include]

files=/etc/supervisor/java.d/*.conf